set prefix=(memdisk)/boot/grub

insmod at_keyboard
insmod nativedisk
insmod xhci
insmod ehci
insmod ohci
insmod uhci
insmod usb
insmod usbms
insmod regexp

gfxpayload=keep

terminal_output gfxterm
terminal_input at_keyboard

for dt in cbfsdisk memdisk; do
	for it in png jpg; do
		if [ -f (${dt})/background.${it} ]; then
			insmod ${it}
			background_image (${dt})/background.${it}
		fi
	done
done

set default="0"
if [ -f (cbfsdisk)/timeout.cfg ]; then
	source (cbfsdisk)/timeout.cfg
else	
	set timeout=8
fi

if [ -f (cbfsdisk)/keymap.gkb ]; then
	keymap (cbfsdisk)/keymap.gkb
fi

function try_user_config {
	if [ "${1}" = "(proc)" ]; then
		return 0
	fi
	if [ "${1}" = "(cbfsdisk)" ]; then
		return 0
	fi
	if [ "${1}" = "(memdisk)" ]; then
		return 0
	fi

	set root="${1}"

	# The @/... entries are for cases where the BTRFS filesystem is being used
	for dir in '' /@ /grub /boot/grub /@/grub /@/boot/grub /grub2 /boot/grub2 /@/grub2 /@/boot/grub2 /boot /@/boot /EFI /EFI/* /@*; do
		if [ -f "${dir}/grub.cfg" ]; then
			unset superusers
			configfile "${dir}/grub.cfg"
		elif [ -f "${dir}/isolinux/isolinux.cfg" ]; then
			syslinux_configfile -i "${dir}/isolinux/isolinux.cfg"
		elif [ -f "${dir}/syslinux/syslinux.cfg" ]; then
			syslinux_configfile -s "${dir}/syslinux/syslinux.cfg"
		elif [ -f "${dir}/syslinux/extlinux.conf" ]; then
			syslinux_configfile -s "${dir}/syslinux/extlinux.conf"
		elif [ -f "${dir}/extlinux/extlinux.conf" ]; then
			syslinux_configfile -s "${dir}/extlinux/extlinux.conf"
		fi
	done
}

menuentry 'Attempt to auto-boot your Linux distro  [o]' --hotkey='o' {

	for vol in (*); do
		try_user_config "${vol}"
		echo
	done

	set pager=0
	echo -n "Attempting to unlock encrypted volumes"
	cryptomount -a
	set pager=1
	echo

	# trying again will find decrypted volumes.
	for vol in (*); do
		try_user_config "${vol}"
		echo
	done

	true # Prevent pager requiring to accept each line instead of whole screen
}

menuentry 'Boot from USB  [s]' --hotkey='s' {
	for vol in (usb*); do
		try_bootcfg "${vol}"
	done
}

if [ -f (cbfsdisk)/img/memtest ]; then
menuentry 'Load MemTest86+  [m]' --hotkey='m' {
	set root='cbfsdisk'
	chainloader /img/memtest
}
fi

menuentry 'Poweroff  [p]' --hotkey='p' {
	halt
}
menuentry 'Reboot  [r]' --hotkey='r' {
	reboot
}

# SPDX-License-Identifier: GPL-3.0-or-later

# can be overridden per-tree e.g. can use mrchromebox
url="https://github.com/coreboot/coreboot.git"
bkup_url="https://review.coreboot.org/coreboot"

makeargs="UPDATED_SUBMODULES=1 CPUS=$XBMK_THREADS"
build_depend="seabios/build grub/default memtest86plus/default"

seavgabiosrom="elf/seabios/default/build/libgfxinit/vgabios.bin"

payload_seabios="n"
payload_memtest="n"
payload_grub="n"

initmode=""
ubootelf=""
uboot_config=""
grubtree=""
displaymode=""
tmprom=""
newrom=""
payload_uboot="" # arm64 only. edk2 replaced it on x86
payload_edk2=""
cbfscfg=""
skip_unlock="" # set y if you don't want IFD/ME auto-unlock at build time
skip_gbe_cook=""
edk2_inserted=""

preconfig="corebootpreconfig"
premake="corebootpremake"
mkhelper="$if_not_dry_build cook_coreboot_build"
postmake="$if_not_dry_build mkcorebootbin"
cook_config="$if_not_dry_build cook_coreboot_config"

# if mk_coreboot_with succeeds, this is set to "y"
# and an error is shown if it's still n at the end.
rom_prepared="n"


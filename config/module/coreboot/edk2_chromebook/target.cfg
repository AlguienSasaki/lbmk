xarch="i386-elf"

tree="default"

# more like a fetch depend. more notes below
build_depend="edk2/edk2_chromebook"

payload_edk2="edk2_chromebook"

# edk2 doesn't get built by lbmk. lbmk only downloads it.
# coreboot edk2 target symlinks to edk2 metadata in lbmk,
# such that changes to edk2 metadata cause coreboot edk2
# elfs to be deleted and re-built. the edk2 build_depend
# above ensures that the actual edk2 source gets re-fetched
# too.

# the lbmk mkhelper functions for coreboot handle edk2 building
# by copying from src/edk2 in lbmk, into coreboot at the location
# inside src/coreboot/TREE: payloads/external/edk2/workspace/

# coreboot mkhelpers in lbmk delete workspace/ before building,
# then copy the edk2 source tree from src/edk2/ into workspace/,
# building it, copying the tianocore payload executable, then
# workspace/ is deleted again.

# target names are matched. for example, coreboot/edk2_chromebook
# is matched to edk2/edk2_chromebook by virtue of code: lbmk's
# coreboot mkhelper assumes that if e.g. payload_edk2="edk2_chromebook",
# so too shall that edk2 src tree be used in lbmk: edk2_chromebook.

# individual coreboot mainboards don't need the edk2 build_depend. they
# have the coreboot edk2 build_depend, which causes that to be build,
# which then triggers edk2 to re-download.

# build_depend here is used specifically because:
# it's guaranteed to run, and edk2 has no build logic in its
# main directory: no makefile, no autogen.sh, no configure script,
# no cmakelist, no nothing. it has its own custom script which
# lbmk doesn't use directly. so ./mk -b edk does nothing except
# download. using fetch_depend would mean that edk2 doesn't get
# updated if coreboot metadata is up to date and src/coreboot/TREE
# exists, so build_depend here functions more like fetch_depend, but
# it's applied just before running make, so it's guaranteed reliable.

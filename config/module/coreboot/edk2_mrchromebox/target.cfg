xarch="i386-elf"

tree="default"

# default is the same as below, but with coreboot/edk2_mrchromebox at the
# end. we must exclude it in *edk2_mrchromebox* to prevent an infinite loop!
build_depend=""

# note: build_depend can be empty here, since lbmk doesn't process payloads
# on this target. coreboot's build system grabs edk2 and builds it instead.

release="n"
